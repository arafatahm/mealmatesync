
name: Build Meal Mate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Meal Mate
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/share@6 @capacitor/filesystem@6 esbuild
          mkdir -p www
          cp index.html www/index.html
          cp native-share.js native-share.entry.js
          npx esbuild native-share.entry.js --bundle --format=esm --platform=browser --outfile=www/native-share.js

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.mealmate.app",
            "appName": "Meal Mate",
            "webDir": "www"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Meal-Mate-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
