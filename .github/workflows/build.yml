
name: Build Meal Mate APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Meal Mate
        run: |
          npm init -y

          npm install \
            @capacitor/core@6 \
            @capacitor/cli@6 \
            @capacitor/android@6 \
            @capacitor/share@6 \
            @capacitor/filesystem@6 \
            @capawesome/capacitor-live-update@v6-lts \
            esbuild

          mkdir -p www
          cp index.html www/index.html

          cp native-share.js native-share.entry.js

          npx esbuild native-share.entry.js \
            --bundle \
            --format=esm \
            --platform=browser \
            --outfile=www/native-share.js

          sed "s/__MEALMATE_BUILD_VERSION__/$GITHUB_SHA/g" \
            native-live-update.entry.js > native-live-update.build.js

          npx esbuild native-live-update.build.js \
            --bundle \
            --format=esm \
            --platform=browser \
            --outfile=www/native-live-update.js

          test -s www/native-share.js
          test -s www/native-live-update.js

          grep -q 'native-share.js' www/index.html

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.mealmate.app",
            "appName": "Meal Mate",
            "webDir": "www",
            "plugins": {
              "LiveUpdate": {
                "readyTimeout": 10000
              }
            }
          }
          EOF

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Create Update ZIP
        run: |
          mkdir -p update-dist

          (cd www && zip -qr ../update-dist/meal-mate-update.zip .)

          printf '{"bundleId":"%s","url":"https://raw.githubusercontent.com/arafatahm/mealmatesync/gh-pages/meal-mate-update.zip?v=%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_SHA" > update-dist/latest.json

      - name: Publish Update Files
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./update-dist
          force_orphan: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Meal-Mate-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
